<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080"><title>F1 TV</title>
<!-- The shell's splash: its own names only (launcher-*), since this head stays under the bundle's page. -->
<style>
@font-face { font-family: 'Launcher Titillium'; src: url('../builtin/fonts/TitilliumWeb-Regular.ttf') format('truetype'); }
@keyframes launcher-spin { to { transform: rotate(360deg); } }
/*
 * The spinner in the centre of the screen, where the bundle's start screen has its own (app/css/style.css), with
 * "Loading…" below. Any TV: a plain ring with one bright part, and the tyre lettering where the browser has
 * conic-gradient masks (Chromium 69+; Tizen 3-4 TVs have older ones).
 */
#launcher-status { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
#launcher-status .launcher-tyre { position: absolute; left: 50%; top: 50%; width: 86px; height: 86px; margin: -43px 0 0 -43px;
  box-sizing: border-box; border-radius: 50%; border: 9px solid rgba(225, 6, 0, 0.3); border-top-color: #ff4634;
  animation: launcher-spin 0.8s linear infinite; }
@supports (-webkit-mask: conic-gradient(#000, #000)) {
  #launcher-status .launcher-tyre { width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 0;
    background: radial-gradient(circle closest-side, transparent 33.5px, #ff4634 34px, #ff4634 35.2px,
      rgba(225, 6, 0, 0.5) 35.8px, rgba(225, 6, 0, 0.5) 38.2px, rgba(255, 70, 52, 0.85) 38.8px, rgba(255, 70, 52, 0.85) 39.6px,
      rgba(225, 6, 0, 0.5) 40.2px, rgba(225, 6, 0, 0.5) 41.4px, #ff4634 42px, #ff4634 43px, transparent 43.5px);
    -webkit-mask: conic-gradient(rgba(0, 0, 0, 0.14) 0deg, rgba(0, 0, 0, 0.14) 20deg, #000 75deg, #000 105deg, rgba(0, 0, 0, 0.14) 160deg,
      rgba(0, 0, 0, 0.14) 200deg, #000 255deg, #000 285deg, rgba(0, 0, 0, 0.14) 340deg);
    animation-duration: 0.175s; }
}
#launcher-status .launcher-text { position: absolute; left: 0; right: 0; top: 50%; margin-top: 92px; text-align: center;
  font: 30px 'Launcher Titillium', sans-serif; color: #8f8f9c; letter-spacing: 0.5px; }
</style></head>
<body style="background:#15151e;color:white;margin:0"><div id="launcher-status"><div class="launcher-tyre"></div><div class="launcher-text">Loading…</div></div>
<!-- This script always loads from the installed file page, before any bundle base is set. -->
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="config.js"></script><script src="../launcher-build.js"></script>
<script src="builtin.js"></script><script src="vendor/nacl-fast.js"></script>
<script src="common.js"></script><script src="boot.js"></script></body></html>
