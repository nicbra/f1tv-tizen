name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Expected an existing version tag such as v0.2.0.' >&2
            exit 1
          }

      - name: Check out the version tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the tested commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install ffmpeg for stitch pixel checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate release tag
        run: bash scripts/build-release.sh "$RELEASE_TAG" --check

      - name: Run Node tests
        run: node --test tests/*.test.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Check shell and JavaScript syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in app/js/*.js app/service/*.js shell/*.js shell/vendor/*.js scripts/*.js; do node --check "$script"; done

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a moved tag
        env:
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Tizen Studio 6.1 CLI
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring libsecret-tools
          installer="$RUNNER_TEMP/web-cli_Tizen_Studio_6.1_ubuntu-64.bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          echo "7f33fe09eda4eb5d50463cf997e8f676d455060720470070ae1932994413aaf4  $installer" | sha256sum --check
          chmod +x "$installer"
          # The Linux installer requires a destination under the user's home directory.
          sdk_dir="$HOME/tizen-studio"
          "$installer" --accept-license "$sdk_dir"
          # The installer wrapper can exit successfully even when installation failed.
          test -x "$sdk_dir/tools/ide/bin/tizen"
          echo "TIZEN_HOME=$sdk_dir" >> "$GITHUB_ENV"

      - name: Import author certificate and build both channel packages
        shell: bash
        env:
          TIZEN_AUTHOR_CERT_BASE64: ${{ secrets.TIZEN_AUTHOR_CERT_BASE64 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          # The diagnostics server's base URL (https://…/diag/v1), a repository Actions variable.
          DIAG_SERVER: ${{ vars.DIAG_SERVER }}
        run: |
          [[ -n "$TIZEN_AUTHOR_CERT_BASE64" && -n "$TIZEN_AUTHOR_PASSWORD" ]] || {
            echo 'Set TIZEN_AUTHOR_CERT_BASE64 and TIZEN_AUTHOR_PASSWORD in repository Actions secrets.' >&2
            exit 1
          }
          # Share Tizen's Secret Service session between profile import and packaging.
          dbus-run-session -- bash -euo pipefail <<'SIGN'
          printf '%s\n' "$TIZEN_AUTHOR_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets
          umask 077
          certificate="$RUNNER_TEMP/f1tv-author.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$TIZEN_AUTHOR_CERT_BASE64" | base64 --decode > "$certificate"
          "$TIZEN_HOME/tools/ide/bin/tizen" security-profiles add \
            -n f1tv -a "$certificate" -p "$TIZEN_AUTHOR_PASSWORD"
          RELEASE_COMMIT="${{ needs.test.outputs.commit }}" bash scripts/build-release.sh "$RELEASE_TAG"
          (cd build && sha256sum --check F1TV.wgt.sha256)
          SIGN

      - name: Pass packages and unsigned bundle to signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release
          retention-days: 7
          if-no-files-found: error
          path: |
            build/*.wgt
            build/*.sha256
            build/bundle-*.tar
            build/bundle.json

  sign:
    needs: [test, build]
    environment: bundle-signing
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a moved tag
        env:
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download packages and unsigned bundle
        uses: actions/download-artifact@v8
        with:
          name: unsigned-release
          path: build

      - name: Sign the bundle manifest
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: node scripts/sign-bundle.js build/bundle.json

      - name: Verify signature, archive and every file against shell keys
        run: node scripts/verify-bundle.js build/bundle.json

      - name: Pass verified release assets to publishing
        uses: actions/upload-artifact@v7
        with:
          name: signed-release
          retention-days: 7
          if-no-files-found: error
          path: |
            build/*.wgt
            build/*.sha256
            build/bundle-*.tar
            build/bundle.json
            build/bundle.json.sig

  publish:
    needs: [test, sign]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a moved tag
        env:
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release
          path: build

      - name: Upload draft assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG"
