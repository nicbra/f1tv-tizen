name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tested prerelease tag to promote, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out promotion tooling
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate assets and promote the published prerelease
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/promote-release.sh "$RELEASE_TAG"
